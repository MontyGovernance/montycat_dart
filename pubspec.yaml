name: montycat
description: >-
  Self-hosted vector database + NoSQL with built-in AI semantic search — the
  Dart & Flutter client for Montycat. A Rust-powered Pinecone alternative for
  RAG & AI agents.
version: 1.2.0
environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  hashlib: ^2.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2

topics:
  - vector-database
  - semantic-search
  - rag
  - ai-agents
  - nosql

license: MIT
homepage: https://montygovernance.com
repository: https://github.com/MontyGovernance/montycat_dart
issue_tracker: https://github.com/MontyGovernance/montycat_dart/issues
documentation: https://pub.dev/documentation/montycat/latest/
